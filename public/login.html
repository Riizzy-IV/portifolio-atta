<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Entrar · Portfólio ATTA3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 20% 85%, rgba(90, 42, 143, 0.45) 0%, rgba(90, 42, 143, 0) 55%),
          radial-gradient(ellipse at 85% 10%, rgba(90, 42, 143, 0.25) 0%, rgba(90, 42, 143, 0) 45%),
          #060509;
        color: #f5f3f8;
        font-family: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .caixa {
        width: min(100%, 400px);
        padding: 40px 34px 34px;
        border-radius: 22px;
        border: 1px solid rgba(245, 243, 248, 0.1);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(14px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      }
      img { height: 26px; width: auto; display: block; }
      .eyebrow {
        margin-top: 34px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #a77ce0;
      }
      h1 { margin-top: 10px; font-size: 28px; font-weight: 300; }
      p.sub { margin-top: 8px; font-size: 13.5px; color: rgba(245, 243, 248, 0.6); }
      form { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
      label { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(245, 243, 248, 0.6); }
      input {
        width: 100%;
        margin-top: 6px;
        padding: 13px 15px;
        border-radius: 12px;
        border: 1px solid rgba(245, 243, 248, 0.14);
        background: rgba(0, 0, 0, 0.35);
        color: #f5f3f8;
        font: inherit;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus { border-color: #a77ce0; }
      button {
        margin-top: 10px;
        padding: 14px;
        border: none;
        border-radius: 40px;
        background: #5a2a8f;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(90, 42, 143, 0.4);
        transition: background 0.2s;
      }
      button:hover { background: #6c37a8; }
      .erro {
        display: none;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(220, 60, 80, 0.14);
        color: #ff9aa8;
        font-size: 13px;
      }
      .erro.visivel { display: block; }
    </style>
  </head>
  <body>
    <main class="caixa">
      <img src="/img/atta-logo.png" alt="ATTA3D" />
      <p class="eyebrow">Portfólio</p>
      <h1>Área restrita</h1>
      <p class="sub">Entre com o usuário e a senha que você recebeu da ATTA3D.</p>
      <form method="post" action="/api/login">
        <p class="erro" id="erro">Usuário ou senha incorretos.</p>
        <label>Usuário<input name="usuario" autocomplete="username" required autofocus /></label>
        <label>Senha<input name="senha" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Entrar</button>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).has('erro')) document.getElementById('erro').classList.add('visivel');
    </script>
  </body>
</html>
